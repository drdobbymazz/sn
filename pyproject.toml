[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sn"
version = "0.1.0"
description = "A local agent that lives on an Android phone and talks to Ollama over Tailscale"
readme = "README.md"
requires-python = ">=3.11"
# No runtime dependencies, deliberately. This installs on a phone, where a
# broken wheel build is a bad evening.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sn = "sn.ui.cli:main"

[tool.setuptools.packages.find]
include = ["sn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
